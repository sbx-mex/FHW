name: Publicar FHW limpio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "input/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: fhw-pages-clean
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Normalizar scripts Linux
        run: chmod +x scripts/*.sh
      - name: Sincronizar numerador, denominador y semanas
        run: python scripts/build_data.py
      - name: Validar antes de publicar
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Regenerar docs desde cero
        run: npm run pages
      - name: Auditar proyecto limpio
        run: python scripts/audit_project.py
      - name: Resumir actualización segura
        run: |
          echo "## FHW · actualización validada" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path("public/data/fhw-dashboard.json").read_text(encoding="utf-8"))
          state = data["meta"]["updateState"]
          print(f"- Última semana publicada: S{state['latestReadyWeek']}")
          print(f"- Semanas listas: {', '.join('S'+str(item) for item in state['readyWeeks'])}")
          print(f"- Pendientes de sincronización: {', '.join('S'+str(item) for item in state['pendingWeeks']) or 'ninguna'}")
          print("- Fórmula: promedio de FHW / Bebidas Lobby por tienda")
          PY
      - name: Publicar sólo salidas vigentes
        run: |
          git add -A docs public/data public/assets
          if git diff --cached --quiet; then
            echo "Sin cambios generados."
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "La rama cambió durante la generación. Se omite publicar una salida desactualizada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualiza dashboard FHW y elimina salidas obsoletas"
          if ! git push origin HEAD:main; then
            echo "Hubo una carga nueva durante la publicación; el siguiente workflow publicará el corte vigente."
            exit 0
          fi
